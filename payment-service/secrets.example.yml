# payment-service local secrets template.
# Copy to `secrets.yml` in this same folder (payment-service/) and fill in real values.
# application.yml imports it with:  spring.config.import: "optional:file:./secrets.yml"
# `secrets.yml` is gitignored - never commit it.
# Alternative: set STRIPE_* environment variables instead (see ../.env.example). Either works;
# the env vars win if both are present.

stripe:
  api:
    secret-key: sk_test_replace_with_your_key
  webhook:
    secret: whsec_replace_with_your_webhook_secret
