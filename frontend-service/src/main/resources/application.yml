server:
  port: 9008

spring:
  application:
    name: frontend-service

  web:
    resources:
      cache:
        cachecontrol:
          # Dev project: always serve fresh HTML/JS/CSS so browser caches can never hide an edit.
          no-store: true

# The SPA reads this nowhere - the gateway base URL is configured once in static/js/api.js.
# Nothing else to configure: this service holds no connections of its own.
