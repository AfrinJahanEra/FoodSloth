server:
  port: 9004

spring:
  application:
    name: order-service

  rabbitmq:
    addresses: localhost:5672
    listener:
      simple:
        # A message this service cannot process is dropped instead of being requeued forever.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3

  mongodb:
    uri: mongodb+srv://era97:era97@cluster0.rali5he.mongodb.net/?appName=Cluster0
    database: food_order_db

management:
  health:
    mongodb:
      enabled: false

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost
