server:
  port: 9001

spring:
  application:
    name: user-service

  mongodb:
    uri: mongodb+srv://era97:era97@cluster0.rali5he.mongodb.net/?appName=Cluster0
    database: food_user_db

management:
  health:
    mongodb:
      enabled: false

jwt:
  # Overridable via JWT_SECRET env var (see .env.example); must match api-gateway, which verifies the tokens.
  secret: ${JWT_SECRET:food-delivery-user-service-jwt-secret-key-change-me-2026}
  expiration-ms: 86400000

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost
