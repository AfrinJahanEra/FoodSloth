  # rather than one supplied by the client.
  restaurant-id: 68f0000000000000000000f1

spring:
  application:
    name: order-service

  mongodb:
    uri: mongodb+srv://era97:era97@cluster0.rali5he.mongodb.net/?appName=Cluster0
    database: food_order_db

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

management:
