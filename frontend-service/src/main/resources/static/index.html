<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodSloth</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css?v=12">
</head>
<body>
<header class="topbar">
    <a class="brand" href="#/">
        <span class="brand-logo"><img src="/assets/logo.png" alt="FoodSloth logo"></span>
        FoodSloth<span class="brand-dot">.</span>
    </a>
    <nav id="nav"></nav>
    <div class="user-box" id="user-box"></div>
</header>

<main id="view" aria-live="polite"></main>

<div id="toasts" aria-live="assertive"></div>

<!-- Core modules (the ?v= suffix busts stale browser caches; bump it after frontend edits) -->
<script src="/js/api.js?v=12"></script>
<script src="/js/auth.js?v=12"></script>
<script src="/js/ui.js?v=12"></script>
<script src="/js/cloudinary.js?v=12"></script>
<script src="/js/icon.js?v=12"></script>

<!-- One file per screen; each registers itself with App.views -->
<script src="/js/app.js?v=12"></script>
<script src="/js/views/login.js?v=12"></script>
<script src="/js/views/signup.js?v=12"></script>
<script src="/js/views/menu.js?v=12"></script>
<script src="/js/views/search.js?v=12"></script>
<script src="/js/views/cart.js?v=12"></script>
<script src="/js/views/checkout.js?v=12"></script>
<script src="/js/views/orders.js?v=12"></script>
<script src="/js/views/track.js?v=12"></script>
<script src="/js/views/notifications.js?v=12"></script>
<script src="/js/views/kitchen.js?v=12"></script>
<script src="/js/views/rider.js?v=12"></script>
<script src="/js/views/profile.js?v=12"></script>
<script src="/js/views/admin-menu.js?v=12"></script>
<script src="/js/views/admin-users.js?v=12"></script>
<script src="/js/views/admin-payments.js?v=12"></script>
</body>
</html>
