<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1260" font-family="Poppins, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="ad" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#1a1d23"/>
    </marker>
    <marker id="aa" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#b45309"/>
    </marker>
    <marker id="as" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#b45309"/>
    </marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#15803d"/>
    </marker>
    <marker id="ap" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4f46e5"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="1260" fill="#ffffff"/>

  <!-- ===================== Title + legend ===================== -->
  <text x="40" y="42" font-size="22" font-weight="700" fill="#1a1d23">FoodSloth — System Architecture</text>
  <text x="40" y="66" font-size="12.5" fill="#67707e">Food-delivery microservices · synchronous REST only through the API gateway · asynchronous events only over RabbitMQ</text>

  <g font-size="11" fill="#1a1d23">
    <rect x="1150" y="26" width="410" height="76" rx="8" fill="#f5f5f3" stroke="#d8d5d0"/>
    <line x1="1166" y1="46" x2="1216" y2="46" stroke="#1a1d23" stroke-width="2" marker-end="url(#ad)"/>
    <text x="1228" y="50">REST call (browser → gateway → service)</text>
    <line x1="1166" y1="68" x2="1216" y2="68" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#aa)"/>
    <text x="1228" y="72">async event (service ⇄ food.exchange)</text>
    <line x1="1166" y1="90" x2="1216" y2="90" stroke="#15803d" stroke-width="2" stroke-dasharray="2 4" marker-end="url(#ag)"/>
    <text x="1228" y="94">third-party / external system call</text>
  </g>

  <!-- ===================== Client ===================== -->
  <rect x="330" y="96" width="940" height="78" rx="10" fill="#fdeded" stroke="#d92b2b" stroke-width="1.5"/>
  <text x="352" y="126" font-size="14" font-weight="600" fill="#1a1d23">Browser — FoodSloth SPA (vanilla JS, no framework)</text>
  <text x="352" y="150" font-size="11.5" fill="#57493f">Roles: CUSTOMER storefront/orders/tracking · ADMIN kitchen board · DELIVERYMAN rider app — static files served by frontend-service :9008</text>

  <line x1="800" y1="174" x2="800" y2="204" stroke="#1a1d23" stroke-width="2" marker-end="url(#ad)"/>
  <text x="812" y="194" font-size="11" fill="#1a1d23">REST + Bearer JWT</text>

  <!-- ===================== Gateway + registry ===================== -->
  <rect x="560" y="208" width="480" height="64" rx="10" fill="#1a1d23"/>
  <text x="800" y="234" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">api-gateway :8080</text>
  <text x="800" y="254" font-size="10.5" fill="#c9cdd4" text-anchor="middle">verifies JWT · injects X-User-Id / X-User-Role · routes by path prefix</text>

  <rect x="64" y="208" width="250" height="64" rx="10" fill="#eceefc" stroke="#4f46e5"/>
  <text x="189" y="234" font-size="13" font-weight="600" fill="#1a1d23" text-anchor="middle">service-registry :8761</text>
  <text x="189" y="254" font-size="10.5" fill="#4f46e5" text-anchor="middle">Eureka — gateway + all 7 services register</text>
  <line x1="318" y1="240" x2="552" y2="240" stroke="#4f46e5" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ap)" marker-start="url(#ap)"/>

  <!-- REST fan-out to services -->
  <line x1="800" y1="272" x2="800" y2="292" stroke="#1a1d23" stroke-width="2"/>
  <line x1="176" y1="292" x2="1424" y2="292" stroke="#1a1d23" stroke-width="2"/>
  <g stroke="#1a1d23" stroke-width="2">
    <line x1="176" y1="292" x2="176" y2="326" marker-end="url(#ad)"/>
    <line x1="384" y1="292" x2="384" y2="326" marker-end="url(#ad)"/>
    <line x1="592" y1="292" x2="592" y2="326" marker-end="url(#ad)"/>
    <line x1="800" y1="292" x2="800" y2="326" marker-end="url(#ad)"/>
    <line x1="1008" y1="292" x2="1008" y2="326" marker-end="url(#ad)"/>
    <line x1="1216" y1="292" x2="1216" y2="326" marker-end="url(#ad)"/>
    <line x1="1424" y1="292" x2="1424" y2="326" marker-end="url(#ad)"/>
  </g>
  <text x="1424" y="286" font-size="10" fill="#67707e" text-anchor="end">gateway routes by path prefix</text>

  <!-- ===================== Services ===================== -->
  <g font-size="10.5" fill="#1a1d23">
    <rect x="78" y="330" width="196" height="132" rx="8" fill="#ffffff" stroke="#d8d5d0"/>
    <text x="88" y="352" font-size="12.5" font-weight="600">user-service</text>
    <text x="88" y="368" font-size="10.5" fill="#67707e">:9001</text>
    <text x="88" y="390">signup/login · JWT</text>
    <text x="88" y="406">roles + secret signup keys</text>
    <text x="88" y="422">customer addresses (GPS pin)</text>

    <rect x="286" y="330" width="196" height="132" rx="8" fill="#ffffff" stroke="#d8d5d0"/>
    <text x="296" y="352" font-size="12.5" font-weight="600">restaurant-service</text>
    <text x="296" y="368" font-size="10.5" fill="#67707e">:9002</text>
    <text x="296" y="390">menu · hours · open status</text>
    <text x="296" y="406">prices checkout + reorder</text>
    <text x="296" y="422">fresh prices, never cached</text>

    <rect x="494" y="330" width="196" height="132" rx="8" fill="#ffffff" stroke="#d8d5d0"/>
    <text x="504" y="352" font-size="12.5" font-weight="600">cart-service</text>
    <text x="504" y="368" font-size="10.5" fill="#67707e">:9003</text>
    <text x="504" y="390">cart · checkout endpoint</text>
    <text x="504" y="406">Dhaka-only delivery check</text>
    <text x="504" y="422">mints orderId (UUID)</text>

    <rect x="702" y="330" width="196" height="132" rx="8" fill="#ffffff" stroke="#d8d5d0"/>
    <text x="712" y="352" font-size="12.5" font-weight="600">order-service</text>
    <text x="712" y="368" font-size="10.5" fill="#67707e">:9004</text>
    <text x="712" y="390">order lifecycle state machine</text>
    <text x="712" y="406">friendly # counters · reorder</text>
    <text x="712" y="422">publishes order.* events</text>

    <rect x="910" y="330" width="196" height="132" rx="8" fill="#ffffff" stroke="#d8d5d0"/>
    <text x="920" y="352" font-size="12.5" font-weight="600">payment-service</text>
    <text x="920" y="368" font-size="10.5" fill="#67707e">:9005</text>
    <text x="920" y="390">Stripe intents + webhook</text>
    <text x="920" y="406">ledger with friendly #</text>
    <text x="920" y="422">COD confirms on delivery</text>

    <rect x="1118" y="330" width="196" height="132" rx="8" fill="#ffffff" stroke="#d8d5d0"/>
    <text x="1128" y="352" font-size="12.5" font-weight="600">delivery-service</text>
    <text x="1128" y="368" font-size="10.5" fill="#67707e">:9006</text>
    <text x="1128" y="390">rider slots · admin assign</text>
    <text x="1128" y="406">live GPS · ETA + distance</text>
    <text x="1128" y="422">Nominatim geocoding</text>

    <rect x="1326" y="330" width="196" height="132" rx="8" fill="#ffffff" stroke="#d8d5d0"/>
    <text x="1336" y="352" font-size="12.5" font-weight="600">notification-service</text>
    <text x="1336" y="368" font-size="10.5" fill="#67707e">:9007</text>
    <text x="1336" y="390">events → per-user inbox</text>
    <text x="1336" y="406">lifecycle + broadcasts</text>
    <text x="1336" y="422">admin announcements</text>
  </g>

  <!-- service ⇄ broker event arrows -->
  <g stroke="#b45309" stroke-width="1.8" stroke-dasharray="6 4">
    <line x1="176" y1="466" x2="176" y2="516" marker-end="url(#aa)" marker-start="url(#as)"/>
    <line x1="384" y1="466" x2="384" y2="516" marker-end="url(#aa)" marker-start="url(#as)"/>
    <line x1="592" y1="466" x2="592" y2="516" marker-end="url(#aa)" marker-start="url(#as)"/>
    <line x1="800" y1="466" x2="800" y2="516" marker-end="url(#aa)" marker-start="url(#as)"/>
    <line x1="1008" y1="466" x2="1008" y2="516" marker-end="url(#aa)" marker-start="url(#as)"/>
    <line x1="1216" y1="466" x2="1216" y2="516" marker-end="url(#aa)" marker-start="url(#as)"/>
    <line x1="1424" y1="466" x2="1424" y2="516" marker-end="url(#aa)" marker-start="url(#as)"/>
  </g>
  <text x="598" y="486" font-size="9.5" fill="#b45309">publish / consume</text>

  <!-- ===================== Broker ===================== -->
  <rect x="78" y="520" width="1444" height="84" rx="10" fill="#fbf0dd" stroke="#b45309" stroke-width="1.5"/>
  <text x="800" y="554" font-size="13.5" font-weight="600" fill="#1a1d23" text-anchor="middle">RabbitMQ — durable topic exchange  food.exchange</text>
  <text x="800" y="576" font-size="10.5" fill="#7c5306" text-anchor="middle">routing key &lt;owner&gt;.&lt;event&gt; (e.g. restaurant.order-priced, delivery.completed) · each consumer declares its own queue &lt;consumer&gt;.&lt;event&gt;.queue · services never call each other over REST</text>

  <!-- ===================== External systems ===================== -->
  <g font-size="10.5" fill="#1a1d23">
    <rect x="78" y="660" width="380" height="92" rx="8" fill="#f5f5f3" stroke="#d8d5d0"/>
    <text x="90" y="684" font-size="12.5" font-weight="600">MongoDB Atlas</text>
    <text x="90" y="704">each service owns its collections</text>
    <text x="90" y="720">counters: order-no · payment-no</text>
    <text x="90" y="736">orders, payments, deliveries, users…</text>

    <rect x="482" y="660" width="260" height="92" rx="8" fill="#f5f5f3" stroke="#d8d5d0"/>
    <text x="494" y="684" font-size="12.5" font-weight="600">Stripe</text>
    <text x="494" y="704">PaymentIntent create/confirm</text>
    <text x="494" y="720">signed webhook → payment-service</text>
    <text x="494" y="736">card charges + refunds removed</text>

    <rect x="766" y="660" width="420" height="92" rx="8" fill="#f5f5f3" stroke="#d8d5d0"/>
    <text x="778" y="684" font-size="12.5" font-weight="600">OpenStreetMap Nominatim (free geocoder)</text>
    <text x="778" y="704">address text → GPS pin (cached lookups)</text>
    <text x="778" y="720">powers ETA/distance + Dhaka-only checks</text>
    <text x="778" y="736">used by delivery, cart and order services</text>

    <rect x="1210" y="660" width="300" height="92" rx="8" fill="#f5f5f3" stroke="#d8d5d0"/>
    <text x="1222" y="684" font-size="12.5" font-weight="600">Cloudinary</text>
    <text x="1222" y="704">menu photos — browser uploads</text>
    <text x="1222" y="720">directly, URLs saved by restaurant</text>
  </g>

  <!-- external dotted arrows -->
  <g stroke="#15803d" stroke-width="1.8" stroke-dasharray="2 4" fill="none">
    <path d="M200,660 L200,470" marker-end="url(#ag)"/>
    <path d="M612,660 L612,636 L960,636 L960,470" marker-end="url(#ag)"/>
    <path d="M976,660 L976,628 L1160,628 L1160,470" marker-end="url(#ag)"/>
    <path d="M1360,660 L1360,620 L1560,620 L1560,135 L1276,135" marker-end="url(#ag)"/>
  </g>
  <text x="210" y="652" font-size="9.5" fill="#15803d">every service persists to its own collections</text>
  <text x="1180" y="612" font-size="9.5" fill="#15803d" text-anchor="end">geocoding</text>
  <text x="1552" y="612" font-size="9.5" fill="#15803d" text-anchor="end">photo upload</text>

  <!-- ===================== Flow panel ===================== -->
  <rect x="78" y="780" width="1444" height="452" rx="10" fill="#ffffff" stroke="#d8d5d0"/>
  <text x="100" y="810" font-size="13.5" font-weight="700" fill="#1a1d23">Primary flow — checkout to delivery (solid = REST · dashed = events over food.exchange)</text>

  <g font-size="11" fill="#1a1d23">
    <text x="100" y="840">1. Customer checks out — cart-service enforces Dhaka-only delivery (GPS-pin box check, or geocoded address) and mints orderId → cart.checked-out.</text>
    <text x="100" y="864">2. restaurant-service prices the basket fresh → restaurant.order-priced (or restaurant.order-unavailable when an item is sold out).</text>
    <text x="100" y="888">3. order-service creates order #N (PENDING_PAYMENT) and raises payment.requested; friendly sequential numbers come from Mongo counters.</text>
    <text x="100" y="912">4. payment-service opens a Stripe PaymentIntent (card) or keeps the ledger PENDING (cash on delivery) → payment.succeeded / payment.failed.</text>
    <text x="100" y="936">5. CONFIRMED → restaurant accepts (PREPARING) → restaurant.order-ready (READY); the ready event also creates the delivery job.</text>
    <text x="100" y="960">6. Admin assigns a free rider (one active slot per rider); cancelling or unassigning an assignment never touches the order itself.</text>
    <text x="100" y="984">7. Rider app streams device GPS every 10 s over REST (POST /deliveries/riders/me/location); the customer map follows the rider live.</text>
    <text x="100" y="1008">8. delivery.started → OUT_FOR_DELIVERY; ETA + remaining km re-computed on every GPS fix (road factor 1.3, 22 km/h, +5 min handover).</text>
    <text x="100" y="1032">9. Addresses without a GPS pin are geocoded through Nominatim so distance/ETA still compute; (0,0) sentinel pins never enter the math.</text>
    <text x="100" y="1056">10. Rider marks delivered → delivery.completed → order DELIVERED; the customer sees the final status on the track page and order list.</text>
    <text x="100" y="1080">11. delivery.completed also flips the COD ledger entry PENDING → SUCCEEDED in payment-service; order.delivered feeds notification-service.</text>
    <text x="100" y="1104">12. notification-service consumes every lifecycle event into the per-user inbox; admins can broadcast announcements to all users.</text>
    <text x="100" y="1128">13. Reorder replays the same pipeline at today's prices via order.reorder-requested — the Dhaka restriction is enforced again.</text>
    <text x="100" y="1152">14. Clients only ever talk REST to api-gateway; services coordinate exclusively through signed events on the shared topic exchange.</text>
  </g>

  <text x="100" y="1192" font-size="10.5" fill="#67707e">Ports — registry 8761 · gateway 8080 · user 9001 · restaurant 9002 · cart 9003 · order 9004 · payment 9005 · delivery 9006 · notification 9007 · frontend 9008</text>
  <text x="100" y="1212" font-size="10.5" fill="#67707e">Money is stored in poisha and displayed as taka (÷100) · GPS (0,0) is the "no pin" sentinel · admin/rider signups require env-configured secret keys</text>
</svg>
