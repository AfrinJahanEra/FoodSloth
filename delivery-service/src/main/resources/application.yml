server:
  port: 9006

spring:
  application:
    name: delivery-service

  rabbitmq:
    addresses: localhost:5672
    listener:
      simple:
        # A message this service cannot process is dropped instead of being requeued forever.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3

  mongodb:
    uri: mongodb+srv://era97:era97@cluster0.rali5he.mongodb.net/?appName=Cluster0
    database: food_delivery_db

delivery:
  # Every rider can carry at most this many deliveries per calendar day.
  slots-per-day: 5
  # False: the admin assigns riders by hand from the admin console. True: nearest free rider is
  # picked automatically (kept as an opt-in fallback).
  auto-assign: false
  # Average city riding speed used for every ETA calculation.
  average-speed-kmph: 22
  # Flat minutes added to an ETA for handing the food over at the restaurant and at the door.
  handover-minutes: 5
  # Riders further than this from the restaurant are never auto-assigned (auto-assign mode only).
  assignment-radius-km: 8
  # A rider whose GPS ping is older than this is treated as unreachable, not available.
  location-max-age-minutes: 5
  # How often unassigned deliveries are retried (no rider was free the first time).
  assignment-sweep-ms: 15000

management:
  health:
    mongodb:
      enabled: false

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost
