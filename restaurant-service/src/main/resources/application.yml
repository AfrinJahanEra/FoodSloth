server:
  port: 9002

spring:
  config:
    # secrets.yml holds the Cloudinary credentials (gitignored). Both paths are tried so it works
    # whether IntelliJ's working directory is the module folder or the project root.
    import: "optional:file:./secrets.yml,optional:file:./restaurant-service/secrets.yml"

  application:
    name: restaurant-service

  rabbitmq:
    addresses: localhost:5672
    listener:
      simple:
        # A message this service cannot process is dropped instead of being requeued forever.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3

  mongodb:
    uri: mongodb+srv://era97:era97@cluster0.rali5he.mongodb.net/?appName=Cluster0
    database: food_restaurant_db

# Pricing rules. This service is the only place a price is decided, so the fee and tax live here
# rather than being hard-coded or duplicated in the cart.
restaurant:
  # Flag-fall delivery fee; also the flat fallback when either location has no coordinates.
  delivery-fee: 40.0
  # Added per km of road distance (straight-line distance x 1.3 road factor).
  delivery-fee-per-km: 12.0
  # A delivery never costs more than this.
  delivery-fee-max: 300.0
  # 5% - expressed as a fraction of the items total.
  tax-rate: 0.05
  currency: BDT

# Cloudinary photo storage. Credentials come from environment variables or secrets.yml;
# the placeholders below make an unconfigured setup fail with a clear message instead of
# a cryptic Cloudinary error.
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:replace_with_your_cloud_name}
  api-key: ${CLOUDINARY_API_KEY:replace_with_your_api_key}
  api-secret: ${CLOUDINARY_API_SECRET:replace_with_your_api_secret}
  folder: food/menu

management:
  health:
    mongodb:
      enabled: false

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost
